name: MARKIPIE Face Index Worker

on:
  workflow_dispatch:
    inputs:
      event_id:
        description: Optional event UUID; leave blank to process all active face-scan events
        required: false
        type: string
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: markipie-face-index
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install worker dependencies
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Build face index
        env:
          SUPABASE_URL: ${{ secrets.MARKIPIE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MARKIPIE_SUPABASE_SERVICE_ROLE_KEY }}
          EVENT_ID: ${{ inputs.event_id }}
        run: npm --prefix worker run index
