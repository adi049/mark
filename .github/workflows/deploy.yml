name: Deploy MARKIPIE to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_URL: https://adi049.github.io/mark
          VITE_BASE_PATH: /mark/
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # GitHub Pages serves this repository below /mark/. Public assets in
      # React are authored as /assets/... for normal hosting, so rewrite only
      # the built output to the project-site prefix.
      - name: Prefix public asset URLs for GitHub Pages
        env:
          VITE_BASE_PATH: /mark/
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import path from 'node:path'

          const base = (process.env.VITE_BASE_PATH || '/').replace(/\/+$/, '') + '/'
          const files = []

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (/\.(html|js|css|mjs|json)$/i.test(entry.name)) files.push(full)
            }
          }

          walk('dist')

          for (const file of files) {
            let text = fs.readFileSync(file, 'utf8')
            text = text.replace(/([\"'\(])\/assets\//g, '$1' + base + 'assets/')
            text = text.replace(/url\(\s*\/assets\//g, 'url(' + base + 'assets/')
            text = text.replace(/([\"'\(])\/favicon(?=[.\"'])/g, '$1' + base + 'favicon')
            fs.writeFileSync(file, text)
          }
          NODE

      # GitHub Pages needs a fallback document for BrowserRouter routes.
      - name: Verify face-scan model assets
        run: |
          test -f dist/models/tiny_face_detector_model-weights_manifest.json
          test -f dist/models/tiny_face_detector_model.bin
          test -f dist/models/face_landmark_68_model-weights_manifest.json
          test -f dist/models/face_landmark_68_model.bin
          test -f dist/models/face_recognition_model-weights_manifest.json
          test -f dist/models/face_recognition_model.bin

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
